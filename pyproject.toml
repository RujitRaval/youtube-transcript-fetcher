[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "youtube-transcript-collector"
version = "0.2.0"
description = "A quiet, local, caption-first YouTube transcript collector"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "YouTube Transcript Collector contributors"}]
dependencies = ["youtube-transcript-api>=1.2.4,<2", "yt-dlp>=2026.3.3", "PyYAML>=6,<7", "requests>=2.32,<3"]

[project.optional-dependencies]
speakers = ["sherpa-onnx==1.13.8", "soundfile>=0.12,<0.15", "imageio-ffmpeg>=0.6,<0.7", "numpy>=1.26,<3"]
dev = ["pytest>=8,<10", "ruff>=0.11", "build>=1.2"]

[project.scripts]
youtube-transcript-collector = "youtube_transcript_collector.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
